<div id="yemi-chat">

  <div id="yemi-window" class="hidden">
    <div class="yemi-header">
      <span>🧠 Yemi - Asistente Virtual</span>
      <button id="yemi-close">✖</button>
    </div>
    <div class="yemi-messages"></div>
    <div class="yemi-input">
      <input type="text" id="yemi-text" placeholder="Escribe tu mensaje..." />
      <button id="yemi-send">➤</button>
    </div>
  </div>
</div>
